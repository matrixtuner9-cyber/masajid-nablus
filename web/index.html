<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f3d27"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>body{margin:0}[hidden]{display:none!important}</style><title>متابعة مساجد نابلس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a working register — stone-coloured page, olive ink, one header band, tabbed views; tables scroll inside their own frames. */
:root{
  --bg:#f3f1ec; --surface:#fbfaf7; --sunk:#e9e6de; --line:#d9d4c8;
  --ink:#232a22; --muted:#5f665b; --olive:#4c6a37; --olive-ink:#fff; --olive-soft:#e3ead8;
  --ok:#2f7a4a; --ok-bg:#dcefe2; --warn:#9a6a10; --warn-bg:#f6ebcf; --bad:#a23a2e; --bad-bg:#f6dcd8; --idle:#7a7f75; --idle-bg:#e6e5df;
  --display:"Cairo",Tahoma,"Segoe UI",sans-serif;
  --body:"Cairo",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171a16; --surface:#1f231d; --sunk:#262b24; --line:#363c33;
  --ink:#e9ebe4; --muted:#a3a99c; --olive:#93b672; --olive-ink:#142010; --olive-soft:#2b3824;
  --ok:#7fcf98; --ok-bg:#1f3527; --warn:#e3bb5f; --warn-bg:#3a3018; --bad:#ef8f82; --bad-bg:#3d221e; --idle:#9ea397; --idle-bg:#2a2e27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171a16; --surface:#1f231d; --sunk:#262b24; --line:#363c33;
  --ink:#e9ebe4; --muted:#a3a99c; --olive:#93b672; --olive-ink:#142010; --olive-soft:#2b3824;
  --ok:#7fcf98; --ok-bg:#1f3527; --warn:#e3bb5f; --warn-bg:#3a3018; --bad:#ef8f82; --bad-bg:#3d221e; --idle:#9ea397; --idle-bg:#2a2e27; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:18px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;padding-block:22px 14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;gap:14px;align-items:center}
.brand svg{flex:none}
.brand h1{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.2;margin:0;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
.today{text-align:left;font-size:.85rem;color:var(--muted)}
.today b{display:block;color:var(--ink);font-size:1rem;font-weight:600}
nav.modes,nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--olive);color:var(--olive-ink);border-color:var(--olive)}
nav.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
h2{font-family:var(--display);font-weight:500;font-size:1.25rem;margin:0}
h3{font-size:1rem;font-weight:600;margin:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:start}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.btn{font:inherit;font-weight:600;border:0;background:var(--olive);color:var(--olive-ink);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.late{background:var(--warn-bg);color:var(--warn)}
.chip.absent{background:var(--bad-bg);color:var(--bad)}
.chip.pending,.chip.na{background:var(--idle-bg);color:var(--idle)}
.chip.leave{background:var(--olive-soft);color:var(--olive)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{border-inline-start:3px solid var(--olive);padding:4px 12px}
.kpi .n{font-family:var(--display);font-size:1.7rem;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.82rem;color:var(--muted)}
.kpi.bad{border-color:var(--bad)} .kpi.warn{border-color:var(--warn)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-weight:600;color:var(--muted);background:var(--sunk);font-size:.8rem}
td.num{font-variant-numeric:tabular-nums}
tr.grp td{background:var(--olive-soft);font-weight:600;font-size:.85rem}
tbody tr:last-child td{border-bottom:0}
.prayers{display:grid;gap:8px}
.prayer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.prayer.now{border-color:var(--olive);box-shadow:inset -4px 0 0 var(--olive)}
.prayer .nm{font-family:var(--display);font-size:1.15rem}
.prayer .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem}
.prayer .act{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prayer .act input{max-width:160px;letter-spacing:.2em;text-align:center;font-variant-numeric:tabular-nums}
.who{display:grid;gap:2px}
.who b{font-family:var(--display);font-size:1.35rem;font-weight:500}
.count{font-variant-numeric:tabular-nums;font-weight:600}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);display:grid;gap:10px;justify-items:center}
.msg{font-size:.88rem;padding:8px 12px;border-radius:8px}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.err{background:var(--bad-bg);color:var(--bad)}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:4px;background:var(--surface);min-width:0}
.item p{margin:0;overflow-wrap:anywhere}
.code{font-variant-numeric:tabular-nums;letter-spacing:.15em;font-weight:700;background:var(--sunk);padding:1px 8px;border-radius:6px}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.88rem}
.checks label{display:flex;gap:5px;align-items:center}
.checks input{width:auto}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--sunk);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .rm{position:absolute;top:4px;inset-inline-start:4px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font:inherit;font-size:.75rem;padding:1px 8px;cursor:pointer}
.chat{display:grid;gap:8px;align-content:start;max-height:min(60vh,520px);min-height:160px;overflow-y:auto;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r)}
.bub{max-width:82%;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.bub.mine{justify-self:start;background:var(--olive-soft);border-color:transparent}
.bub.theirs{justify-self:end}
.bub img{border-radius:8px;max-height:220px;max-width:100%;margin-top:6px}
.bub time{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
.msgs-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.msgs-grid{grid-template-columns:minmax(0,1fr)}}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block;flex:none}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,12,9,.88);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:88vh;border-radius:8px}
details>summary{cursor:pointer}

/* ===== Entry portal: one photographic world, fixed palette by design ===== */
.portal{position:fixed;inset:0;z-index:40;overflow:hidden;background:#1d1f1a;color:#f5f1e6;font-family:var(--body);transition:opacity .7s ease,visibility .7s;direction:rtl}
.portal.out{opacity:0;visibility:hidden}
.pt-stage{--fx:50%;--fy:-50%;position:absolute;left:50%;top:50%;width:max(100vw,155.28vh);height:max(100vh,64.4vw);transform:translate(calc(var(--fx)*-1),var(--fy)) scale(1.03);transform-origin:28% 45%}
@media (max-aspect-ratio:1/1){.pt-stage{--fx:24%;--fy:0%;top:-24vh;height:118vh;width:183.2vh}}
@media (max-width:760px){
  .portal .pt-card{gap:11px}
  .portal .pt-title{font-size:1.55rem}
  .portal .pt-title span{display:inline;margin-inline-start:.3em}
  .portal .pt-clock .t{font-size:2rem}
  .portal .pt-clock .d{font-size:.78rem}
  .portal .pt-pr{padding:5px 1px;font-size:.72rem}.portal .pt-pr b{font-size:.8rem}
  .portal .pt-org small{display:none}
  .portal .pt-id{padding-top:11px;gap:9px}
  .portal .pt-id .pt-note:last-child{display:none}
}
.pt-img{transition:opacity 1.2s ease;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.pt-glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;transform:translate(-50%,-50%)}
.pt-glow.dome{left:20.6%;top:44%;width:17%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(175,255,150,.42),rgba(120,220,110,.14) 55%,transparent 72%)}
.pt-glow.win{left:20.4%;top:48.6%;width:13%;height:2.6%;border-radius:40%;background:radial-gradient(closest-side,rgba(255,230,150,.75),rgba(255,200,90,.2) 60%,transparent)}
.pt-glow.clock{left:47.8%;top:57.8%;width:6.5%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(255,244,215,.55),rgba(255,226,170,.15) 60%,transparent)}
.pt-glow.sun{left:92%;top:6%;width:55%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(255,196,140,.32),rgba(255,170,110,.1) 50%,transparent 75%)}
.pt-shadow{position:absolute;inset:-10% -60%;pointer-events:none;background:radial-gradient(40% 55% at 30% 70%,rgba(10,12,20,.32),transparent 70%),radial-gradient(30% 40% at 75% 60%,rgba(10,12,20,.22),transparent 70%)}
.pt-rays{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.35;
  background:repeating-conic-gradient(from 205deg at 104% -8%,rgba(255,214,160,.0) 0deg,rgba(255,214,160,.16) 2.2deg,rgba(255,214,160,0) 5deg,rgba(255,214,160,0) 9deg);
  -webkit-mask-image:radial-gradient(120% 90% at 100% 0%,#000 10%,transparent 70%);mask-image:radial-gradient(120% 90% at 100% 0%,#000 10%,transparent 70%)}
.pt-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pt-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(14,16,12,.78) 0%,rgba(14,16,12,.45) 34%,rgba(14,16,12,0) 62%),linear-gradient(0deg,rgba(14,16,12,.55),transparent 35%)}
@media (max-width:760px){.pt-shade{background:linear-gradient(0deg,rgba(14,16,12,.92) 0%,rgba(14,16,12,.7) 48%,rgba(14,16,12,.05) 80%)}}
.pt-wrap{position:relative;z-index:2;height:100%;display:flex;align-items:center;justify-content:flex-start;
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));overflow-y:auto}
@media (max-width:760px){.pt-wrap{align-items:flex-end;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.pt-card{width:min(460px,100%);display:grid;gap:18px;padding:28px;border-radius:20px;background:rgba(20,24,17,.5);border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);box-shadow:0 30px 80px rgba(0,0,0,.45)}
@media (max-width:760px){.pt-card{padding:20px;gap:14px}}
.pt-org{display:flex;gap:12px;align-items:center}
.pt-org small{display:block;font-size:.78rem;color:rgba(245,241,230,.72);letter-spacing:.02em}
.pt-org b{font-size:.95rem;font-weight:600}
.pt-title{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.15;margin:0;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.pt-title span{display:block;color:#bfe29a}
.pt-clock{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pt-clock .t{font-family:var(--display);font-size:clamp(2.2rem,6vw,3.1rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.pt-clock .d{font-size:.85rem;color:rgba(245,241,230,.78);display:grid}
.pt-prayers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pt-pr{display:grid;justify-items:center;gap:1px;padding:7px 2px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:.78rem;color:rgba(245,241,230,.8)}
.pt-pr b{font-size:.9rem;color:#f5f1e6;font-variant-numeric:tabular-nums;font-weight:600}
.pt-pr.next{background:rgba(191,226,154,.18);border-color:rgba(191,226,154,.55);color:#e9f6dc}
.pt-next{font-size:.85rem;color:rgba(245,241,230,.85)}
.pt-next b{color:#bfe29a;font-variant-numeric:tabular-nums}
.pt-id{display:grid;gap:12px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.pt-me{display:flex;gap:10px;align-items:center}
.pt-me img{width:40px;height:40px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.25)}
.pt-me .n{font-weight:600}
.pt-tag{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 10px;border-radius:999px;background:rgba(255,255,255,.12);color:#f5f1e6}
.pt-tag.ok{background:rgba(127,207,152,.22);color:#b9f0c9}.pt-tag.wait{background:rgba(227,187,95,.22);color:#f6dc9a}.pt-tag.bad{background:rgba(239,143,130,.22);color:#ffc4bb}
.pt-go{font:inherit;font-weight:700;font-size:1.02rem;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;background:#bfe29a;color:#17230f;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,background .2s}
.pt-go:hover{background:#d2eeb3}.pt-go:active{transform:scale(.98)}
.pt-go:focus-visible,.pt-alt:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pt-go[disabled]{opacity:.5;cursor:default}
.pt-alt{font:inherit;font-size:.88rem;background:transparent;border:1px solid rgba(255,255,255,.25);color:#f5f1e6;border-radius:10px;padding:8px 14px;cursor:pointer}
.pt-note{font-size:.76rem;color:rgba(245,241,230,.62);margin:0}
.pt-cap{position:absolute;z-index:2;bottom:max(12px,env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));font-size:.72rem;color:rgba(255,255,255,.7);text-shadow:0 1px 6px rgba(0,0,0,.6)}
@media (max-width:760px){.pt-cap{display:none}}
.pt-spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#bfe29a;display:inline-block}
@media (prefers-reduced-motion:no-preference){
  .pt-stage{animation:pt-burns 46s ease-in-out infinite alternate}
  .pt-glow.dome{animation:pt-pulse 6.5s ease-in-out infinite}
  .pt-glow.win{animation:pt-flicker 4.2s ease-in-out infinite}
  .pt-glow.clock{animation:pt-pulse 4s ease-in-out infinite 1.2s}
  .pt-glow.sun{animation:pt-sun 14s ease-in-out infinite}
  .pt-rays{animation:pt-rays 11s ease-in-out infinite}
  .pt-shadow{animation:pt-shadow 38s linear infinite}
  .pt-card{animation:pt-rise .9s cubic-bezier(.2,.8,.2,1) both .15s}
  .pt-spin{animation:pt-rot .9s linear infinite}
  .pt-go:not([disabled]){animation:pt-breathe 3.2s ease-in-out infinite}
}
@keyframes pt-burns{from{transform:translate(calc(var(--fx)*-1),var(--fy)) scale(1.03)}to{transform:translate(calc(var(--fx)*-1 - 1.2%),calc(var(--fy) - .6%)) scale(1.11)}}
@keyframes pt-pulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.94)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes pt-flicker{0%,100%{opacity:.5}30%{opacity:.95}45%{opacity:.7}70%{opacity:1}}
@keyframes pt-sun{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes pt-rays{0%,100%{opacity:.18}50%{opacity:.42}}
@keyframes pt-shadow{from{transform:translateX(-18%)}to{transform:translateX(18%)}}
@keyframes pt-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pt-rot{to{transform:rotate(360deg)}}
@keyframes pt-breathe{0%,100%{box-shadow:0 0 0 0 rgba(191,226,154,.45)}50%{box-shadow:0 0 0 10px rgba(191,226,154,0)}}
.hdr-actions{display:flex;gap:10px;align-items:flex-end}

/* ===== Imam & caretaker phone app ===== */
body.phone-app .wrap{max-width:520px}
body.phone-app header.top{display:none}
body.phone-app{padding-block:max(12px,env(safe-area-inset-top,0px)) calc(92px + env(safe-area-inset-bottom,0px))}
body.phone-app input,body.phone-app select,body.phone-app textarea{font-size:16px;padding:11px 12px}
body.phone-app .btn{padding:12px 18px;font-size:1rem;border-radius:12px}
body.phone-app .btn.sm{padding:8px 13px;font-size:.88rem}
body.phone-app .grid2{grid-template-columns:minmax(0,1fr)!important}
body.phone-app .panel{border-radius:16px}
body.phone-app .prayer{padding:14px 16px;border-radius:16px}
body.phone-app .prayer .nm{font-size:1.3rem}
body.phone-app .prayer .act>.btn:first-child{flex:1;min-height:50px;font-size:1.05rem}
body.phone-app .prayer .act input{max-width:none;flex:1;font-size:20px}
.app-bar{display:grid;gap:12px;padding:18px;border-radius:18px;background:var(--olive);color:var(--olive-ink)}
.app-bar .ab-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.app-bar .ab-role{font-size:.78rem;opacity:.85}
.app-bar .ab-name{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.3}
.app-bar .ab-mosque{font-size:.86rem;opacity:.9}
.app-bar .ab-next{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--olive-ink) 25%,transparent)}

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);

const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const fmtT=d=>d?d.toLocaleTimeString('ar-PS',{hour:'numeric',minute:'2-digit'}):'—';
const fmtD=d=>d.toLocaleDateString('ar-PS',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function hijri(d){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){return''}}
const uidGen=()=>Math.random().toString(36).slice(2,10);
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const codeHash=(mid,code)=>sha('nablus-awqaf|'+mid+'|'+String(code).trim());

/* ---------- prayer times for Nablus (Egyptian authority angles 19.5° / 17.5°, Shafi'i Asr) ---------- */
const LAT=32.2211,LNG=35.2544;
const P=[{k:'fajr',n:'الفجر'},{k:'dhuhr',n:'الظهر'},{k:'asr',n:'العصر'},{k:'maghrib',n:'المغرب'},{k:'isha',n:'العشاء'}];
const pName=(k,d)=>k==='dhuhr'&&d.getDay()===5?'الجمعة':P.find(p=>p.k===k).n;
/* computed times plus the directorate's minute adjustments (لضبط المواقيت على تقويم الوزارة) */
function prayerTimes(day){
  const t=rawPrayerTimes(day),o=(typeof S!=='undefined'&&S.settings&&S.settings.offsets)||{};
  for(const p of P){const m=+o[p.k]||0;if(m)t[p.k]=new Date(t[p.k].getTime()+m*60000)}
  return t;
}
function rawPrayerTimes(day){
  const dg=Math.PI/180,sin=x=>Math.sin(x*dg),cos=x=>Math.cos(x*dg),acos=x=>Math.acos(x)/dg,asin=x=>Math.asin(x)/dg,atan2=(y,x)=>Math.atan2(y,x)/dg;
  const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
  let y=day.getFullYear(),m=day.getMonth()+1,d=day.getDate();if(m<=2){y--;m+=12}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  const jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5+0.5-LNG/360;
  const D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360);
  const L=fix(q+1.915*sin(g)+0.020*sin(2*g),360),e=23.439-0.00000036*D;
  const RA=fix(atan2(cos(e)*sin(L),cos(L))/15,24),decl=asin(sin(e)*sin(L)),eqt=((q/15-RA+12)%24+24)%24-12;
  const noon=12-LNG/15-eqt;
  const T=a=>acos((-sin(a)-sin(decl)*sin(LAT))/(cos(decl)*cos(LAT)))/15;
  const asrA=acos((sin(Math.atan(1/(1+Math.tan(Math.abs(LAT-decl)*dg)))/dg)-sin(decl)*sin(LAT))/(cos(decl)*cos(LAT)))/15;
  const base=Date.UTC(day.getFullYear(),day.getMonth(),day.getDate());
  const at=hrs=>new Date(Math.ceil((base+hrs*3600e3)/60000)*60000);
  return{fajr:at(noon-T(19.5)),sunrise:at(noon-T(0.833)),dhuhr:at(noon+2/60),asr:at(noon+asrA),maghrib:at(noon+T(0.833)+2/60),isha:at(noon+T(17.5))};
}
/* check-in window: opens 20 min before adhan, closes at the next prayer; late after 15 min */
const OPEN_BEFORE=20,LATE_AFTER=15;
function windowOf(k,t){const n={fajr:t.sunrise,dhuhr:t.asr,asr:t.maghrib,maghrib:t.isha,isha:new Date(t.isha.getTime()+150*60000)}[k];return{open:new Date(t[k].getTime()-OPEN_BEFORE*60000),close:n}}
function statusOf(rec,k,staff,dayKey){
  if(rec)return rec.v===false||rec.pv===false?'bad':rec.min>LATE_AFTER?'late':'ok';
  if(staff&&staff.duties&&!staff.duties.includes(k))return'na';
  /* staff without an account, or days before approval, are not counted */
  if(staff&&!staff.uid)return'na';
  if(staff&&staff.approvedAt&&dayKey<dkey(new Date(staff.approvedAt)))return'na';
  if(leaveOn(staff,dayKey,k))return'leave';
  const day=fromKey(dayKey),t=prayerTimes(day),w=windowOf(k,t);
  /* a prayer whose registration closed before the account was approved is not counted */
  if(staff&&staff.approvedAt&&w.close.getTime()<=Date.parse(staff.approvedAt))return'na';
  return Date.now()<w.close.getTime()?'pending':'absent';
}
const ST={ok:'في الوقت',late:'متأخر',absent:'غائب',pending:'لم يحن',na:'غير مكلّف',bad:'مرفوض',open:'التسجيل مفتوح',leave:'إجازة'};
const chip=(s,extra)=>h('span',{class:'chip '+(s==='bad'?'absent':s==='open'?'late':s)},ST[s]+(extra?' · '+extra:''));

/* ---------- state ---------- */
const S={db:null,user:null,uid:null,admin:false,mode:'staff',adminTab:'apps',staffTab:'prayers',
  mosques:[],staff:[],codes:{},myStaffId:null,myAtt:null,dayAtt:{},dayKey:dkey(new Date()),
  lessons:[],reports:[],month:dkey(new Date()).slice(0,7),monthAtt:[],myHistory:[],openPrayer:null,editMosque:null,editStaff:null,loaded:{m:false,s:false},apps:[],myApp:null,appLoaded:false,draft:null,editingApp:false,monthly:[],myMonthly:null,myMonthlyExists:false,repMonth:null,myRepMonth:null,mdraft:null,assets:null,phMsg:'',
  myThread:null,myThreadExists:false,myMsgs:[],threads:[],openThread:null,threadMsgs:[],chatDraft:{},chatPhoto:{},seenMarked:{},bcast:'',bcastOpen:false,bcastStatus:'',
  myCreds:null,credsLoaded:false,unlocked:false,creds:[],
  myMonths:{},dayDocs:[],monthDocs:[],codeDocs:{},codesLoaded:false,settings:null,settingsLoaded:false,privKey:null,
  myInbox:{},myOutbox:{},myOutDoc:null,outbox:{},rstatus:{},phones:{},thrIn:{},thrOut:{},
  ld:{},rd:{},appSel:{},rejReason:{},revNote:{},sending:{},ph:{},askLocal:{},lv:{},lvNote:{},myLeaves:null,leaves:{}};
const unsub={};
function sub(name,fn){if(unsub[name])unsub[name]();unsub[name]=fn()}
const onErr=e=>console.warn('db',e&&e.code,e&&e.message);

/* ---------- boot ---------- */
(function tickHeader(){const n=new Date();$('#gDate').textContent=fmtD(n);$('#hDate').textContent=hijri(n)+' هـ'})();
async function boot(){
  const claude=window.claude;
  if(!claude||!claude.use){return fail()}
  const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db){return fail()}
  S.db=db;S.user=user;
  S.uid=user?await user.id():null;
  if(user){const me=await user.me();S.myName=me.name||'';S.myAvatar=me.avatarUrl||''}
  S.admin=user?await user.canEdit():false;
  /* the directorate's dashboard lives in admin.js and is fetched only for accounts with edit rights */
  if(S.admin){try{await loadAdminScript()}catch(e){S.admin=false;S.adminLoadFailed=true}}
  S.mode=S.admin&&portalKind()==='admin'?'admin':'staff';
  sub('mosques',()=>db.collection('org/main/mosques').onSnapshot(s=>{S.mosques=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));S.loaded.m=true;refresh()},onErr));
  sub('staff',()=>db.collection('org/main/staff').onSnapshot(s=>{S.staff=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));S.loaded.s=true;const mine=S.staff.find(x=>x.uid&&x.uid===S.uid),v=mine?mine.id:null;if(v!==S.myStaffId){S.myStaffId=v;watchMine()}refresh()},onErr));

  if(S.extAuth){S.unlocked=true;S.credsLoaded=true;S.myCreds={ext:true}}
  if(S.uid&&!S.extAuth)sub('myCreds',()=>db.doc('creds/'+S.uid).onSnapshot(s=>{S.myCreds=s.exists?s.data():null;S.credsLoaded=true;
      if(S.myCreds&&!S.unlocked&&sessionOk())S.unlocked=true;
      if(!S.myCreds&&S.unlocked){S.unlocked=false;clearSession();showPortal()}
      render();refresh()},e=>{S.credsLoaded=true;onErr(e);refresh()}));
  if(S.admin)sub('creds',()=>db.collection('creds').onSnapshot(s=>{S.creds=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},onErr));
  claude.use('assets').then(a=>{S.assets=a;refresh();
    if(S.admin&&a){const tryClean=()=>{if(S.settingsLoaded)cleanupPhotos().catch(onErr);else setTimeout(tryClean,2000)};setTimeout(tryClean,4000)}}).catch(()=>{});
  sub('settings',()=>db.doc('org/main/settings/app').onSnapshot(s=>{S.settings=s.exists?s.data():null;S.settingsLoaded=true;if(S.admin)ensureKeys();refresh()},onErr));
  sub('rstatus',()=>db.collection('org/main/rstatus').onSnapshot(s=>{S.rstatus={};s.docs.forEach(d=>S.rstatus[d.id]=d.data());refresh()},onErr));
  if(S.uid){
    sub('myThread',()=>db.doc('threads/'+S.uid).onSnapshot(s=>{S.myThread=s.exists?s.data():null;S.myThreadExists=s.exists;refresh()},onErr));
    sub('myOutDoc',()=>db.doc('outbox/'+S.uid).onSnapshot(s=>{S.myOutDoc=s.exists?s.data():null;refresh()},onErr));
    sub('myLeaves',()=>db.doc('leaves/'+S.uid).onSnapshot(s=>{S.myLeaves=s.exists?s.data():null;refresh()},onErr));
    watchMyMsgs();
    sub('myMonthly',()=>db.doc('monthly/'+S.uid).onSnapshot(s=>{S.myMonthly=s.exists?s.data():null;S.myMonthlyExists=s.exists;refresh()},onErr));
  }
  if(S.admin){
    sub('threads',()=>db.collection('threads').onSnapshot(s=>{S.threads=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},onErr));
    sub('outbox',()=>db.collection('outbox').onSnapshot(s=>{S.outbox={};s.docs.forEach(d=>S.outbox[d.id]=d.data());refresh()},onErr));
    sub('leaves',()=>db.collection('leaves').onSnapshot(s=>{S.leaves={};s.docs.forEach(d=>S.leaves[d.id]=d.data());refresh()},onErr));
    sub('monthly',()=>db.collection('monthly').onSnapshot(s=>{S.monthly=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},onErr));
    sub('apps',()=>db.collection('applications').onSnapshot(s=>{S.apps=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.submittedAt||'').localeCompare(a.submittedAt||''));refresh()},onErr));
    sub('codes',()=>db.collection('org/keys/codes').onSnapshot(s=>{S.codes={};S.codeDocs={};s.docs.forEach(d=>{S.codeDocs[d.id]=d.data();S.codes[d.id]=d.data().code});S.codesLoaded=true;upgradeMosques();verifyPending();refresh()},onErr));
    sub('phones',()=>db.collection('org/keys/phones').onSnapshot(s=>{S.phones={};s.docs.forEach(d=>S.phones[d.id]=d.data().phone);refresh()},onErr));
    sub('reportsOpen',()=>db.collection('reports').where('status','in',['new','work']).onSnapshot(s=>{S.reportsOpen=s.docs.map(d=>({id:d.id,...d.data()}));mergeReports()},onErr));
    sub('reportsDone',()=>db.collection('reports').orderBy('createdAt','desc').limit(80).onSnapshot(s=>{S.reportsRecent=s.docs.map(d=>({id:d.id,...d.data()}));mergeReports()},onErr));
    watchDay();watchMonth();
  }
  render();
  setInterval(()=>{
    const k=dkey(new Date());
    if(k!==S.today){const old=S.today;S.today=k;watchMine();
      if(S.admin){if(S.dayKey===old){S.dayKey=k;watchDay()}if(S.month===old.slice(0,7)&&k.slice(0,7)!==S.month){S.month=k.slice(0,7);watchMonth()}}}
    const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;refresh()},60000);
}
/* report status lives in an admin-only path so imams cannot close reports themselves */
const repStatus=r=>(S.rstatus[r.id]&&S.rstatus[r.id].status)||'new';
S.today=dkey(new Date());
function fail(){S.failed=true;ptIdentity(true);$('#main').replaceChildren(h('div',{class:'empty'},h('h2',null,'يلزم تسجيل الدخول'),h('p',null,'افتح هذه الصفحة وأنت مسجّل الدخول بحساب لديه صلاحية "مساهم" أو أعلى حتى تُحفظ السجلات وتظهر للمديرية.')))}
/* imam: this month's and last month's attendance-and-lessons documents */
function watchMine(){
  S.myMonths={};

  const cur=S.today.slice(0,7),prev=prevMonthKey(cur);
  [[cur,'myAttC'],[prev,'myAttP']].forEach(([mk,nm])=>sub(nm,()=>S.db.doc('att/'+mk+'_'+S.myStaffId).onSnapshot(s=>{S.myMonths[mk]=s.exists?s.data():null;refresh()},onErr)));
  const me=staffBy(S.myStaffId);
  if(me&&me.mosqueId&&!S.admin)sub('myReports',()=>S.db.collection('reports').where('mosqueId','==',me.mosqueId).onSnapshot(s=>{S.reports=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));refresh()},onErr));
}

/* ---------- photos ---------- */
async function toJpeg(file){
  if(!/^image\//.test(file.type||'image/'))throw{code:'unsupported_type'};
  if(file.type==='image/gif'||(file.size<400000&&/jpeg|png|webp/.test(file.type)))return file;
  let bmp=null;try{bmp=await createImageBitmap(file)}catch(e){}
  if(!bmp)return file;
  const s=Math.min(1,1600/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82));
}
async function uploadImg(file){if(!S.assets)throw{code:'not_granted'};const b=await toJpeg(file);const r=await S.assets.upload(b,{type:b.type&&/^image\/(jpeg|png|gif|webp)$/.test(b.type)?b.type:'image/jpeg'});return r.id}

  return h('div',{style:'display:grid;gap:12px'},greet(name,'','تسجيل الدخول'),form,forgot);
}
function setupForm(name){
  const err=h('p',{class:'pt-err',role:'alert'});let busy=false;
  const btn=h('button',{class:'pt-go',type:'submit'},'حفظ والدخول',goIcon());
  const form=h('form',{class:'pt-form',onsubmit:async e=>{e.preventDefault();if(busy)return;
    const u=normUser(PT.f.su||''),p=PT.f.sp||'',c=PT.f.sc||'';
    if(!userOk(u)){err.textContent=u.length<3?'اسم المستخدم قصير؛ اكتب 3 خانات على الأقل.':u.length>40?'اسم المستخدم طويل؛ الحد الأقصى 40 خانة.':'اسم المستخدم يحتوي رموزاً غير مسموحة. استخدم الحروف (عربية أو إنجليزية) والأرقام فقط.';return}
    if(!pwOk(p)){err.textContent='كلمة المرور 8 خانات على الأقل وتحتوي على حروف وأرقام.';return}
    if(p!==c){err.textContent='كلمتا المرور غير متطابقتين.';return}
    busy=true;btn.disabled=true;err.textContent='';
    try{const salt=b64(crypto.getRandomValues(new Uint8Array(16)));const hash=await pbkdf2(p,salt,PITER);
      const doc={uid:S.uid,username:u,salt,hash,iter:PITER,createdAt:new Date().toISOString()};
      await S.db.doc('creds/'+S.uid).set(doc);S.myCreds=doc;PT.f={};afterLogin()}
    catch(e2){err.textContent='تعذّر حفظ بيانات الدخول. تأكد من صلاحيتك على الصفحة.';busy=false;btn.disabled=false}}},
    h('label',{class:'pt-field'},'اسم المستخدم',h('input',{id:'ptNewUser',dir:'auto',style:'text-align:start',autocomplete:'username',autocapitalize:'none',spellcheck:'false',placeholder:'مثال: احمد_نابلس أو 0599123456',value:PT.f.su||'',oninput:e=>{PT.f.su=e.target.value}})),
    h('div',{class:'pt-field'},h('label',{for:'ptNewPass'},'كلمة المرور'),pwInput('ptNewPass','new-password','sp')),
    h('div',{class:'pt-field'},h('label',{for:'ptNewPass2'},'تأكيد كلمة المرور'),pwInput('ptNewPass2','new-password','sc')),
    h('ul',{class:'pt-rules'},h('li',null,'اسم المستخدم بالعربية أو الإنجليزية أو رقم هاتفك، 3 خانات على الأقل.'),h('li',null,'كلمة المرور 8 خانات على الأقل، فيها حروف وأرقام.')),
    err,btn);
  return h('div',{style:'display:grid;gap:12px'},greet(name,'wait','أول دخول: أنشئ بيانات الدخول'),form);
}

/* ---------- sign-in against the directorate's own server ---------- */
const AUTH_ERR=e=>{const m=String((e&&e.message)||e||'');return/invalid login|invalid_credentials/i.test(m)?'اسم المستخدم أو كلمة المرور (أو رمز التفعيل) غير صحيح.':/banned/i.test(m)?'هذا الحساب موقوف. راجع مديرية أوقاف نابلس.':/rate|too many/i.test(m)?'محاولات كثيرة. انتظر دقائق ثم حاول مجدداً.':/same|different from the old/i.test(m)?'اختر كلمة مرور مختلفة عن رمز التفعيل.':/weak|short/i.test(m)?'كلمة المرور ضعيفة. استخدم 8 خانات على الأقل فيها حروف وأرقام.':/fetch|network/i.test(m)?'تعذّر الاتصال بالخادم. تحقق من الإنترنت.':'تعذّر الدخول: '+m};
function extPrefill(){try{const p=new URLSearchParams((location.hash||'').replace(/^#/,''));if(p.get('u'))PT.f.u=p.get('u');if(p.get('c'))PT.f.p=p.get('c');if(p.get('u'))history.replaceState(null,'',location.pathname)}catch(e){}}
function extLoginForm(){
  const err=h('p',{class:'pt-err',role:'alert'});let busy=false;
  const btn=h('button',{class:'pt-go',type:'submit'},'تسجيل الدخول',goIcon());
  const imam=portalKind()==='imam';
  const form=h('form',{class:'pt-form',autocomplete:'on',onsubmit:async e=>{e.preventDefault();if(busy)return;
    const u=String(PT.f.u||'').trim().toLowerCase().replace(/\s+/g,''),p=toLatin(PT.f.p||'').trim();
    if(!u||!p){err.textContent='أدخل اسم المستخدم وكلمة المرور.';return}
    busy=true;btn.disabled=true;err.textContent='';
    try{await extAuth.login(u,p);PT.f={};location.reload()}catch(e2){err.textContent=AUTH_ERR(e2);busy=false;btn.disabled=false}}},
    h('label',{class:'pt-field'},'اسم المستخدم',h('input',{id:'ptUser',dir:'ltr',style:'text-align:start',autocomplete:'username',autocapitalize:'none',spellcheck:'false',value:PT.f.u||'',oninput:e=>{PT.f.u=e.target.value}})),
    h('div',{class:'pt-field'},h('label',{for:'ptPass'},imam?'كلمة المرور أو رمز التفعيل':'كلمة المرور'),pwInput('ptPass','current-password','p')),
    err,btn);
  return h('div',{style:'display:grid;gap:12px'},greet('', '', imam?'دخول الأئمة والآذنين':'دخول إدارة النظام'),form,
    h('p',{class:'pt-note',style:'font-size:.82rem'},imam?'تصلك بيانات الدخول (اسم المستخدم ورمز التفعيل) من مديرية الأوقاف عبر واتساب. نسيت كلمة المرور؟ اطلب من المديرية رمزاً جديداً.':'نسيت كلمة المرور؟ يصدر مدير آخر للنظام رمزاً جديداً من «حسابات التطبيق».'));
}
function extPwForm(optional){
  const err=h('p',{class:'pt-err',role:'alert'});let busy=false;
  const btn=h('button',{class:'pt-go',type:'submit'},'حفظ كلمة المرور',goIcon());
  const form=h('form',{class:'pt-form',onsubmit:async e=>{e.preventDefault();if(busy)return;
    const p=PT.f.sp||'',c=PT.f.sc||'';
    if(!pwOk(p)){err.textContent='كلمة المرور 8 خانات على الأقل وتحتوي على حروف وأرقام.';return}
    if(p!==c){err.textContent='كلمتا المرور غير متطابقتين.';return}
    busy=true;btn.disabled=true;err.textContent='';
    try{await extAuth.setPassword(p);PT.f={};location.reload()}catch(e2){err.textContent=AUTH_ERR(e2);busy=false;btn.disabled=false}}},
    h('div',{class:'pt-field'},h('label',{for:'ptNewPass'},'كلمة المرور الجديدة'),pwInput('ptNewPass','new-password','sp')),
    h('div',{class:'pt-field'},h('label',{for:'ptNewPass2'},'تأكيد كلمة المرور'),pwInput('ptNewPass2','new-password','sc')),
    h('ul',{class:'pt-rules'},h('li',null,'8 خانات على الأقل، فيها حروف وأرقام.'),h('li',null,'لا تشاركها مع أحد. رمز التفعيل يتوقف عن العمل بعد حفظها.')),
    err,btn);
  return h('div',{style:'display:grid;gap:12px'},greet(S.myName||'',optional?'':'wait',optional?'تغيير كلمة المرور':'أول دخول: أنشئ كلمة مرور خاصة بك'),form,
    optional?h('button',{class:'pt-link',type:'button',onclick:()=>{S.extChange=false;ptKey='';ptIdentity(true)}},'تراجع'):h('button',{class:'pt-link',type:'button',onclick:logout},'تسجيل الخروج'));
}
async function start(){
  if(!window.extAuth)return boot();
  extPrefill();
  let s=null;try{s=await extAuth.session()}catch(e){}
  if(!s){S.extOut=true;ptIdentity(true);return}
  S.extAuth=true;
  if((s.user.user_metadata||{}).must_change){S.extMust=true;S.myName=(s.user.user_metadata||{}).name||'';ptIdentity(true);return}
  await boot();
}
function showPortal(){const p=$('#portal');p.hidden=false;void p.offsetWidth;p.classList.remove('out');document.documentElement.style.overflow='hidden';ptStart();ptTick();ptIdentity(true)}
function hidePortal(){const p=$('#portal');p.classList.add('out');document.documentElement.style.overflow='';setTimeout(()=>{if(p.classList.contains('out')){p.hidden=true;ptStop()}},750)}
$('#toPortal').addEventListener('click',logout);
(function(){const im=document.querySelector('.pt-img');if(im&&!im.complete){im.style.opacity=0;im.addEventListener('load',()=>{im.style.opacity=1})}})();
document.documentElement.style.overflow='hidden';ptStart();ptTick();

start();
</script>
