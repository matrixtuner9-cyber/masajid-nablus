name: imam
description: تطبيق الأئمة – مديرية أوقاف نابلس
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.6.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: any
  flutter_local_notifications: any
  timezone: any
  workmanager: any
  local_auth: any
  shared_preferences: any
  image_picker: any
  image: any
  crypto: any
  intl: any
  hijri: any
  app_links: any
  url_launcher: any
dev_dependencies:
  flutter_launcher_icons: any
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#2F3D27"
  adaptive_icon_foreground: assets/icon_fg.png
  min_sdk_android: 23
flutter:
  uses-material-design: true
  assets:
    - assets/nablus.webp
    - assets/icon.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
