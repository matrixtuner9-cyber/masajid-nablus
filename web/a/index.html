<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفعيل حساب الإمام · مساجد نابلس</title><meta name="theme-color" content="#2f3d27"><link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#1f2a1a;--olive:#4d6b3c;--gold:#c9a24a;--bg:#f4efe4;--card:#fffdf8;--muted:#6b6a5e}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
.hero{min-height:44vh;background:linear-gradient(180deg,rgba(20,28,16,.25),rgba(20,28,16,.85)),url(/nablus.avif) center/cover;color:#fff;display:grid;align-content:end;padding:24px 18px}
.hero h1{margin:0;font-size:1.6rem;font-weight:800}.hero p{margin:4px 0 0;opacity:.9}
main{max-width:520px;margin:-28px auto 30px;padding:0 16px;display:grid;gap:14px}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 8px 30px rgba(31,42,26,.12);display:grid;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.kv b{font-size:1.15rem;direction:ltr;text-align:left;letter-spacing:.06em}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:12px;border:0;background:var(--olive);color:#fff;font:700 1.05rem Cairo,sans-serif;text-decoration:none;cursor:pointer}
.btn.alt{background:#fff;color:var(--olive);border:2px solid var(--olive)}.btn.sm{min-height:34px;font-size:.85rem;padding:0 10px;background:#eee8da;color:var(--ink)}
ol{margin:0;padding-inline-start:20px;display:grid;gap:6px}.muted{color:var(--muted);font-size:.9rem;margin:0}
.step{display:flex;gap:10px;align-items:center}.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:800}
</style></head><body>
<div class="hero"><h1>تفعيل حساب الإمام</h1><p>مديرية أوقاف نابلس · نظام متابعة المساجد</p></div>
<main id="m"></main>
<script>
const p=new URLSearchParams(location.search),u=(p.get('u')||'').toLowerCase(),c=p.get('c')||'';
const ua=navigator.userAgent,android=/Android/i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
const APK='https://waeflhdjgxexwfawgfvh.supabase.co/storage/v1/object/public/app/masajid-nablus.apk';
const portal='/imam/#u='+encodeURIComponent(u)+'&c='+encodeURIComponent(c);
const intent='intent://activate?u='+encodeURIComponent(u)+'&c='+encodeURIComponent(c)+'#Intent;scheme=masajidnablus;package=ps.awqaf.nablus.imam;end';
const m=document.getElementById('m');
const copy=(t,b)=>navigator.clipboard.writeText(t).then(()=>{b.textContent='نُسخ'}).catch(()=>{});
let creds=u?`<div class="card"><div class="kv"><span>اسم المستخدم</span><b>${u.replace(/[<>&]/g,'')}</b><button class="btn sm" onclick="copy(u,this)">نسخ</button><span>رمز التفعيل</span><b>${c.replace(/\D/g,'')}</b><button class="btn sm" onclick="copy(c,this)">نسخ</button></div><p class="muted">بعد أول دخول ستُنشئ كلمة مرور خاصة بك، ويتوقف رمز التفعيل عن العمل.</p></div>`:'';
let body;
if(android)body=`<div class="card"><div class="step"><span class="n">1</span><b>نزّل تطبيق الأئمة</b></div><a class="btn" href="${APK}">تنزيل التطبيق (أندرويد)</a>
<p class="muted">إن ظهر تنبيه «تطبيق من مصدر غير معروف» اسمح بالتثبيت من المتصفح أو مدير الملفات، ثم ثبّت التطبيق.</p>
<div class="step"><span class="n">2</span><b>فعّل حسابك</b></div><a class="btn alt" href="${intent}">فتح التطبيق وتعبئة البيانات تلقائياً</a>
<p class="muted">أو افتح التطبيق واكتب اسم المستخدم ورمز التفعيل بنفسك.</p></div>`;
else if(ios)body=`<div class="card"><div class="step"><span class="n">1</span><b>افتح بوابة الأئمة</b></div><a class="btn" href="${portal}">فتح بوابة الأئمة</a>
<div class="step"><span class="n">2</span><b>أضفها إلى الشاشة الرئيسية</b></div><ol><li>اضغط زر المشاركة <b>⬆︎</b> أسفل Safari.</li><li>اختر «إضافة إلى الشاشة الرئيسية».</li><li>افتح البوابة من الأيقونة كأنها تطبيق.</li></ol></div>`;
else body=`<div class="card"><b>افتح هذا الرابط من هاتفك</b><p class="muted">تطبيق الأئمة يعمل على الهاتف. أرسل الرابط إلى هاتفك وافتحه هناك.</p><a class="btn alt" href="${APK}">تنزيل تطبيق أندرويد</a><a class="btn alt" href="${portal}">بوابة الأئمة (آيفون)</a></div>`;
m.innerHTML=creds+body;
</script></body></html>
